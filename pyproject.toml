[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "evalforge"
version = "0.1.0"
description = "Regression testing for RAG and agentic AI: retrieval and conversational evaluations."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "EvalForge Contributors" }]
keywords = ["evaluation", "rag", "ai", "testing", "regression"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Testing",
]
dependencies = [
    "typer>=0.9.0",
    "pyyaml>=6.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "httpx>=0.25",
    "rich>=13.0",
    "tenacity>=8.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-asyncio>=0.21",
    "pytest-cov>=4.1",
    "ruff>=0.1",
    "mypy>=1.5",
    "pyright>=1.1.350",
]
llm = [
    "openai>=1.0",
    "anthropic>=0.20",
]
hf = [
    "datasets>=2.14",
    "transformers>=4.30",
    "torch>=2.0",
]
server = [
    "fastapi>=0.100",
    "uvicorn>=0.23",
    "loguru>=0.7.0",
]
all = [
    "evalforge[dev,llm,hf,server]",
]

[project.scripts]
evalforge = "evalforge.cli:app"

# Ruff is configured at the repository root (evalforge/ruff.toml).

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
strict = true

[[tool.mypy.overrides]]
module = [
    "yaml",
    "datasets",
    "apscheduler.*",
    "anthropic",
]
ignore_missing_imports = true

