[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "evalforge"
version = "0.1.0"
description = "Offline-first regression testing for RAG and agentic AI, with inspectable evidence."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "EvalForge Contributors" }]
keywords = ["evaluation", "rag", "ai", "testing", "regression"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Testing",
]
dependencies = [
    "typer>=0.27.2",
    "pyyaml>=6.0.3",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "httpx>=0.28.1",
    "rich>=15.0.0",
    "tenacity>=9.1.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.8",
    "mypy>=2.3.1",
    "pyright>=1.1.414",
]
llm = [
    "openai>=3.19.2",
    "anthropic>=1.8.0",
]
hf = [
    "datasets>=5.0.1",
    "transformers>=5.17.0",
    "torch>=2.14.0",
]
server = [
    "fastapi>=0.141.1",
    "uvicorn>=0.53.0",
    "loguru>=0.7.3",
]
all = [
    "evalforge[dev,llm,hf,server]",
]

[project.scripts]
evalforge = "evalforge.cli:app"

# Ruff is configured at the repository root (evalforge/ruff.toml).

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
strict = true

[[tool.mypy.overrides]]
module = [
    "yaml",
    "datasets",
    "apscheduler.*",
    "anthropic",
]
ignore_missing_imports = true

