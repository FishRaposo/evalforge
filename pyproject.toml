[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "evalforge"
version = "0.2.0"
description = "Offline-first regression testing for RAG and agentic AI, with inspectable evidence."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "EvalForge Contributors" }]
keywords = ["evaluation", "rag", "ai", "testing", "regression"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Testing",
]
dependencies = [
    "typer>=0.27.3",
    "pyyaml>=6.0.3",
    "pydantic>=2.14.1",
    "pydantic-settings>=2.16.1",
    "httpx>=0.28.1",
    "rich>=15.0.0",
    "tenacity>=9.2.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.1",
    "mypy>=2.4.0",
    "pyright>=1.1.414",
]
llm = [
    "openai>=3.36.1",
    "anthropic>=2.1.0",
]
hf = [
    "datasets>=5.1.0",
    "transformers>=5.20.2",
    "torch>=2.14.1",
]
server = [
    "fastapi>=0.159.1",
    "uvicorn>=0.54.0",
    "loguru>=0.7.3",
    "python-multipart>=0.0.32",
]
all = [
    "evalforge[dev,llm,hf,server]",
]

[project.scripts]
evalforge = "evalforge.cli:app"

[tool.hatch.build.targets.wheel.force-include]
"data/portfolio" = "evalforge/data/portfolio"
"example_suites/portfolio_evidence.yaml" = "evalforge/data/example_suites/portfolio_evidence.yaml"

# Ruff is configured at the repository root (evalforge/ruff.toml).

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
strict = true

[[tool.mypy.overrides]]
module = [
    "yaml",
    "datasets",
    "apscheduler.*",
    "anthropic",
]
ignore_missing_imports = true

