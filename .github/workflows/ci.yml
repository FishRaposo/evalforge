name: AI Evaluation CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install shared-core + EvalForge
        run: |
          python -m pip install --upgrade pip
          pip install "git+https://github.com/FishRaposo/operator-shared-core.git" ruff
          pip install -e ".[dev,server]"
      - run: ruff check evalforge tests scripts
      - run: ruff format --check evalforge tests scripts

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install shared-core + EvalForge
        run: |
          python -m pip install --upgrade pip
          pip install "git+https://github.com/FishRaposo/operator-shared-core.git"
          pip install -e ".[dev,server,llm]"
      - run: pytest tests/ -q --tb=short --cov=evalforge --cov-report=term

  evaluate-mock:
    name: Run Evaluations (Mock Backend)
    runs-on: ubuntu-latest
    needs: unit-tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install shared-core + EvalForge
        run: |
          python -m pip install --upgrade pip
          pip install "git+https://github.com/FishRaposo/operator-shared-core.git"
          pip install -e ".[server]"
      - name: Run RAG basic evaluation
        run: evalforge eval example_suites/rag_basic.yaml --format markdown --output ./reports
      - name: Run citation evaluation
        run: evalforge eval example_suites/rag_citation.yaml --format json --output ./reports
      - name: Run compliance evaluation
        run: evalforge eval example_suites/compliance.yaml --format html --output ./reports
      - name: Upload evaluation reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evaluation-reports
          path: reports/
          retention-days: 30
