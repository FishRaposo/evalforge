name: AI Evaluation CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install EvalForge
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,server,llm]"
      - run: python -m ruff check evalforge tests scripts
      - run: python -m ruff format --check evalforge tests scripts
      - run: pyright evalforge

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install EvalForge
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,server,llm]"
      - run: pytest tests/ -q --tb=short --cov=evalforge --cov-report=term-missing --cov-fail-under=80

  contracts:
    name: Calibration, traces, and compatibility contracts
    runs-on: ubuntu-latest
    needs: unit-tests
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install EvalForge
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,server,llm]"
      - name: Run staged contract fixtures
        run: |
          pytest -q tests/test_llm_judge_calibration.py tests/test_agent_trace.py
          pytest -q tests/test_compatibility.py tests/test_compatibility_golden.py
          pytest -q tests/test_evidence_v2.py

  package-install:
    name: Wheel install without external shared_core
    runs-on: ubuntu-latest
    needs: unit-tests
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Build and install wheel
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,server]"
          mkdir -p wheelhouse
          pip wheel . --no-deps -w wheelhouse
          pip install --force-reinstall --no-deps wheelhouse/*.whl
      - name: Import vendored package and scan forbidden dependencies
        run: |
          python -c "import evalforge.config, evalforge.server.app, evalforge.shared_core.config"
          ! rg -n "\.\./shared-core|git\+https://.*operator-shared-core|^\s*(from|import) shared_core" evalforge Makefile .github docs README.md

  evaluate-mock:
    name: Run Evaluations (Mock Backend)
    runs-on: ubuntu-latest
    needs: unit-tests
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install EvalForge
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[server]"
      - name: Run RAG basic evaluation
        run: evalforge eval example_suites/rag_basic.yaml --format markdown --output ./reports
      - name: Run citation evaluation
        run: evalforge eval example_suites/rag_citation.yaml --format json --output ./reports
      - name: Run compliance evaluation
        run: evalforge eval example_suites/compliance.yaml --format html --output ./reports
      - name: Upload evaluation reports
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: evaluation-reports
          path: reports/
          retention-days: 30

  evidence:
    name: Offline Evidence Bundle
    runs-on: ubuntu-latest
    needs: unit-tests
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install EvalForge
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,server]"
      - name: Build and verify golden evidence
        run: python scripts/check_portfolio_evidence.py --output-dir ./evidence-artifact
      - name: Upload evidence bundle
        uses: actions/upload-artifact@v7
        with:
          name: evalforge-portfolio-evidence
          path: evidence-artifact/
          retention-days: 30

  frontend:
    name: Dashboard (tests, build, e2e)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22.12.0"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dashboard dependencies
        run: npm ci
      - name: Run dashboard unit tests
        run: npm test
      - name: Lint dashboard
        run: npm run lint
      - name: Build dashboard
        run: npm run build
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: Run dashboard smoke tests
        run: npm run test:e2e
