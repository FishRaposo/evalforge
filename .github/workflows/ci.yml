name: AI Evaluation CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  UV_PYTHON: "3.11"

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.8.17"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install EvalForge (locked)
        run: |
          uv sync --locked --extra dev --extra server --extra llm
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
      - run: python -m ruff check evalforge tests scripts
      - run: python -m ruff format --check evalforge tests scripts
      - run: pyright evalforge

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.8.17"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install EvalForge (locked)
        run: |
          uv sync --locked --extra dev --extra server --extra llm
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
      - run: pytest tests/ -q --tb=short --cov=evalforge --cov-report=term-missing --cov-fail-under=80

  contracts:
    name: Calibration, traces, and compatibility contracts
    runs-on: ubuntu-latest
    needs: unit-tests
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.8.17"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install EvalForge (locked)
        run: |
          uv sync --locked --extra dev --extra server --extra llm
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
      - name: Run staged contract fixtures
        run: |
          pytest -q tests/test_llm_judge_calibration.py tests/test_agent_trace.py
          pytest -q tests/test_compatibility.py tests/test_compatibility_golden.py
          pytest -q tests/test_evidence_v2.py

  package-install:
    name: Wheel install without external shared_core
    runs-on: ubuntu-latest
    needs: unit-tests
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.8.17"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install EvalForge (locked)
        run: |
          uv sync --locked --extra dev --extra server
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
      - name: Build and install wheel
        run: |
          uv build --wheel --out-dir wheelhouse
          uv pip install --force-reinstall --no-deps wheelhouse/*.whl
      - name: Import vendored package and scan forbidden dependencies
        run: |
          python -c "import evalforge.config, evalforge.server.app, evalforge.shared_core.config"
          ! rg -n "\.\./shared-core|git\+https://.*operator-shared-core|^\s*(from|import) shared_core" evalforge Makefile .github docs README.md
      - name: Fresh server wheel outside checkout
        run: |
          python -m venv "$RUNNER_TEMP/evalforge-wheel"
          WHEEL=$(echo wheelhouse/evalforge-*-py3-none-any.whl)
          "$RUNNER_TEMP/evalforge-wheel/bin/python" -m pip install "${WHEEL}[server]"
          "$RUNNER_TEMP/evalforge-wheel/bin/python" -m pip check
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/evalforge-wheel/bin/python" -I "$GITHUB_WORKSPACE/scripts/verify_installed_portfolio.py"

  evaluate-mock:
    name: Run Evaluations (Mock Backend)
    runs-on: ubuntu-latest
    needs: unit-tests
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.8.17"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install EvalForge (locked)
        run: |
          uv sync --locked --extra server
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
      - name: Run RAG basic evaluation
        run: evalforge eval example_suites/rag_basic.yaml --format markdown --output ./reports
      - name: Run citation evaluation
        run: evalforge eval example_suites/rag_citation.yaml --format json --output ./reports
      - name: Run compliance evaluation
        run: evalforge eval example_suites/compliance.yaml --format html --output ./reports
      - name: Upload evaluation reports
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: evaluation-reports
          path: reports/
          retention-days: 30

  evidence:
    name: Offline Evidence Bundle
    runs-on: ubuntu-latest
    needs: unit-tests
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.8.17"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install EvalForge (locked)
        run: |
          uv sync --locked --extra dev --extra server
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
      - name: Build and verify golden evidence
        run: python scripts/check_portfolio_evidence.py --output-dir ./evidence-artifact
      - name: Verify saved-response strict gates and schema-v3 evidence
        run: python scripts/check_strict_evidence.py --output-dir ./strict-evidence-artifact
      - name: Upload evidence bundle
        uses: actions/upload-artifact@v7
        with:
          name: evalforge-portfolio-evidence
          path: |
            evidence-artifact/
            strict-evidence-artifact/
          retention-days: 30

  frontend:
    name: Dashboard (tests, build, e2e)
    # Playwright system deps lag the ubuntu-latest migration (ubuntu26.04).
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22.12.0"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dashboard dependencies
        run: npm ci
      - name: Run dashboard unit tests
        run: npm test
      - name: Lint dashboard
        run: npm run lint
      - name: Build dashboard
        run: npm run build
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: Run dashboard smoke tests
        run: npm run test:e2e

  connected:
    name: Real CLI, API and production dashboard
    # Playwright system deps lag the ubuntu-latest migration (ubuntu26.04).
    runs-on: ubuntu-24.04
    needs: unit-tests
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v7
        with:
          node-version: "22.12.0"
      - run: python -m pip install -e ".[dev,server]"
      - run: npm ci
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - name: Real-process connected verification
        run: npx playwright test --config=playwright.live.config.ts
        working-directory: frontend
        env:
          EVALFORGE_TEST_PYTHON: python
          OPENAI_API_KEY: ""
          EVALFORGE_OPENAI_API_KEY: ""
          ANTHROPIC_API_KEY: ""
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: evalforge-connected-browser
          path: |
            frontend/playwright-live-report/
            frontend/test-results/
